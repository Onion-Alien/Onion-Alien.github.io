<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved to onionalien.com</title>
<meta name="robots" content="noindex">
<script>
  // Everything moved to onionalien.com: the old /onionboard/ pages go to the same page
  // under /onionboard/ there, anything else to the home page.
  var p = location.pathname;
  location.replace(/^\/onion-?board(\/|$)/i.test(p)
    ? "https://onionalien.com/onionboard/" + p.replace(/^\/onion-?board\/?/i, "") + location.search + location.hash
    : "https://onionalien.com/");
</script>
<style>
  body { font-family: "Segoe UI", system-ui, sans-serif; background:#0f1016; color:#e8e6f0;
         display:flex; min-height:90vh; align-items:center; justify-content:center; }
  a { color:#a48bff; }
</style>
</head>
<body>
<p>Moved to <a href="https://onionalien.com/">onionalien.com</a>.</p>
</body>
</html>
